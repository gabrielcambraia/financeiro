services:
  - type: web
    name: financeiro
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGENS_PERMITIDAS
        sync: false
      - key: FINANCEIRO_CHAVE_CIFRAGEM
        sync: false
      - key: FINANCEIRO_CHAVE_HMAC_DOC
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: FINANCEIRO_REMETENTE_EMAIL
        sync: false
