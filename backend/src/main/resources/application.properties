spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload de logo de banco (guardado como bytea no Postgres, ver BancoService)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# JWT (access token curto) + refresh token (sessão de inatividade). O access
# token precisa expirar bem antes do refresh: a renovação só acontece quando
# uma chamada à API leva 401, então se os dois TTLs forem iguais o refresh já
# está expirado no instante em que o access expira e a sessão nunca desliza.
financeiro.jwt.segredo=${JWT_SECRET}
financeiro.jwt.validade-acesso-minutos=${JWT_VALIDADE_ACESSO_MINUTOS:5}
financeiro.token-atualizacao.validade-minutos=${TOKEN_ATUALIZACAO_VALIDADE_MINUTOS:15}
financeiro.cookie.seguro=${COOKIE_SEGURO:true}

# CORS + verificação de Origin (CSRF defense-in-depth) — em produção, aponte
# para o domínio real via env var (lista separada por vírgula).
financeiro.cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Actuator sob /api/actuator: cai automaticamente sob a regra de segurança
# "anyRequest().authenticated()" (evita o permitAll de rotas fora de /api/).
# Só health/metrics expostos — nunca env/beans/heapdump (vazam segredo/config).
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Loga (sem valores de bind, por privacidade) qualquer query acima do limiar,
# com o tempo gasto — recurso nativo do Hibernate, sem dependência nova.
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=300

# Tamanho do lote de ativos por página no AgendadorRendimento — evita carregar
# todos os ativos com indexador da plataforma numa única lista/transação.
financeiro.rendimento.tamanho-lote=${RENDIMENTO_TAMANHO_LOTE:200}

# Cifragem de dados PII (CPF/CNPJ) — chaves em base64, 32 bytes cada
financeiro.cifragem.chave=${FINANCEIRO_CHAVE_CIFRAGEM}
financeiro.cifragem.chave-hmac=${FINANCEIRO_CHAVE_HMAC_DOC}

# E-mail (SMTP) para envio de códigos de verificação/OTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
financeiro.email.remetente=${FINANCEIRO_REMETENTE_EMAIL:noreply@financeiro.app}
